<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12263a">
<title>Chamados de Prova</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./estilo.css">
</head>
<body>

<div id="faixa-demo" class="faixa faixa-demo" hidden>
  MODO DEMO — os dados ficam só neste aparelho
</div>

<button id="faixa-audio" class="faixa faixa-audio" hidden type="button">
  🔇 Toque aqui para ativar o som dos chamados
</button>

<header id="cabecalho">
  <button id="btn-inicio" class="link-cabecalho" type="button" hidden>‹ Início</button>
  <span id="titulo-tela">Chamados de Prova</span>
  <span id="pilula-conexao" class="pilula" data-estado="ligando">conectando…</span>
</header>

<main id="app" aria-live="polite"></main>

<div id="snackbar" class="snackbar" hidden>
  <span id="snackbar-texto"></span>
  <button id="snackbar-acao" type="button" hidden></button>
</div>

<script type="module" src="./js/app.js"></script>
<noscript>
  <p style="padding:1rem">Este site precisa de JavaScript ativado para funcionar.</p>
</noscript>
</body>
</html>
